<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Disease Scanner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 20px;
      color: #333;
    }

    .container {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #1b4332;
      text-align: center;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
      outline: none;
      background-color: #fff;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #startBtn { background-color: #2d6a4f; color: white; }
    #startBtn:hover { background-color: #1b4332; }

    #stopBtn { background-color: #e63946; color: white; }
    #stopBtn:hover { background-color: #d62828; }

    #speakBtn { background-color: #0284c7; color: white; }
    #speakBtn:hover { background-color: #0369a1; }

    .camera-container {
      position: relative;
      width: 100%;
      height: 260px;
      background-color: #111827;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-placeholder {
      color: #9ca3af;
      font-size: 0.95rem;
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #4ade80;
      box-shadow: 0 0 12px #4ade80;
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0% { top: 0; }
      50% { top: 100%; }
      100% { top: 0; }
    }

    .hidden { display: none !important; }

    .result-card {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 6px solid #22c55e;
      border-radius: 10px;
      padding: 16px;
    }

    .result-card h2 {
      font-size: 1.2rem;
      color: #15803d;
      margin-bottom: 12px;
    }

    .info-row {
      margin-bottom: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .info-row strong {
      color: #166534;
    }
  </style>
</head>
<body>

  <h1>பயிர் நோய் கண்டறிதல் scanner</h1>

  <div class="controls">
    <select id="langSelect">
      <option value="ta-IN">தமிழ் (Tamil)</option>
      <option value="te-IN">తెలుగు (Telugu)</option>
      <option value="kn-IN">ಕನ್ನಡ (Kannada)</option>
      <option value="ml-IN">മലയാളം (Malayalam)</option>
      <option value="hi-IN">हिन्दी (Hindi)</option>
      <option value="mr-IN">मराठी (Marathi)</option>
      <option value="gu-IN">ગુજરાતી (Gujarati)</option>
      <option value="pa-IN">ਪੰਜਾਬੀ (Punjabi)</option>
      <option value="bn-IN">বাংলা (Bengali)</option>
      <option value="or-IN">ଓଡ଼ିଆ (Odia)</option>
      <option value="en-IN">English</option>
    </select>

    <div class="btn-group">
      <button id="startBtn">ஸ்கேன் செய் (Start)</button>
      <button id="stopBtn">நிறுத்து (Stop)</button>
      <button id="speakBtn">🔊 பேசு (Speak)</button>
    </div>
  </div>

  <div class="camera-container">
    <div id="cameraPlaceholder" class="camera-placeholder">கேமரா ஆன் செய்யப்படவில்லை</div>
    <video id="webcam" autoplay playsinline class="hidden"></video>
    <div id="scanLine" class="scan-line hidden"></div>
  </div>

  <div id="resultCard" class="result-card hidden">
    <h2 id="diseaseName">-</h2>
    <div class="info-row"><strong>மீட்பு நிலை:</strong> <span id="recoveryStatus">-</span></div>
    <div class="info-row"><strong>துல்லியம்:</strong> <span id="accuracyVal">-</span></div>
    <div class="info-row"><strong>வகை:</strong> <span id="diseaseType">-</span></div>
    <div class="info-row"><strong>அறிகுறிகள்:</strong> <span id="symptomsText">-</span></div>
    <div class="info-row"><strong>இயற்கை சிகிச்சை:</strong> <span id="organicCure">-</span></div>
    <div class="info-row"><strong>ரசாயன சிகிச்சை:</strong> <span id="chemicalCure">-</span></div>
  </div>
</div>

// DOM References
const langSelect = document.getElementById('langSelect');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const speakBtn = document.getElementById('speakBtn');
const webcam = document.getElementById('webcam');
const cameraPlaceholder = document.getElementById('cameraPlaceholder');
const scanLine = document.getElementById('scanLine');
const resultCard = document.getElementById('resultCard');

const diseaseName = document.getElementById('diseaseName');
const recoveryStatus = document.getElementById('recoveryStatus');
const accuracyVal = document.getElementById('accuracyVal');
const diseaseType = document.getElementById('diseaseType');
const symptomsText = document.getElementById('symptomsText');
const organicCure = document.getElementById('organicCure');
const chemicalCure = document.getElementById('chemicalCure');

let stream = null;
let currentLanguage = "ta-IN";
let availableVoices = [];

// Voice loading mechanism
function loadVoices() {
  if ('speechSynthesis' in window) {
    availableVoices = window.speechSynthesis.getVoices();
  }
}

if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

// UI & Audio Sync
function updateUIAndVoice(langCode) {
  currentLanguage = langCode;
  const data = languageData[langCode] || languageData["en-IN"];

  diseaseName.innerText = data.diseaseName;
  recoveryStatus.innerText = data.recoveryStatus;
  accuracyVal.innerText = "94.8%";
  diseaseType.innerText = data.diseaseType;
  symptomsText.innerText = data.symptomsText;
  organicCure.innerText = data.organicCure;
  chemicalCure.innerText = data.chemicalCure;

  speakDiagnostics(data.speechText, langCode);
}

// Text-to-Speech Core Function
function speakDiagnostics(text, langCode) {
  if (!('speechSynthesis' in window)) return;

  window.speechSynthesis.cancel(); // Reset ongoing speech

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = langCode;
  utterance.rate = 0.9;

  if (availableVoices.length === 0) loadVoices();

  const targetLang = langCode.toLowerCase().replace('_', '-');
  const nativeVoice = availableVoices.find(v => {
    const vLang = v.lang.toLowerCase().replace('_', '-');
    return vLang === targetLang || vLang.startsWith(targetLang.split('-')[0]);
  });

  if (nativeVoice) {
    utterance.voice = nativeVoice;
  }

  window.speechSynthesis.speak(utterance);
}

// Event Listeners
langSelect.addEventListener('change', (e) => {
  if (!resultCard.classList.contains('hidden')) {
    updateUIAndVoice(e.target.value);
  } else {
    currentLanguage = e.target.value;
  }
});

speakBtn.addEventListener('click', () => {
  const data = languageData[currentLanguage] || languageData["en-IN"];
  speakDiagnostics(data.speechText, currentLanguage);
});

startBtn.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: "environment" } 
    });
    
    webcam.srcObject = stream;
    webcam.classList.remove('hidden');
    cameraPlaceholder.classList.add('hidden');
    scanLine.classList.remove('hidden');

    // Simulated scan latency
    setTimeout(() => {
      resultCard.classList.remove('hidden');
      updateUIAndVoice(langSelect.value);
    }, 1500);

  } catch (err) {
    alert("Camera permissions required: " + err.message);
  }
});

stopBtn.addEventListener('click', () => {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  webcam.srcObject = null;
  webcam.classList.add('hidden');
  cameraPlaceholder.classList.remove('hidden');
  scanLine.classList.add('hidden');
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
});
</script>

</body>
</html>
