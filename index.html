            justify-content: center;

        }

            width: 70%;
            height: 70%;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 8px;
            pointer-events: none;
        }

        // 1. Play Beep Sound (Instant Audio Feedback)
        function playScanBeep() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // High pitch beep
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio play blocked");
            }
        }

        // 2. Play Voice Speech
        function speakText(text, lang) {
            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); // Clear any previous speech

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.85; // Natural speed for farmers
            utterance.volume = 1.0; // Max volume

            window.speechSynthesis.speak(utterance);
        }

        // 3. User Action Trigger to Unlock Audio Context
        startBtn.addEventListener('click', async () => {
            // Unlock Mobile Web Audio Context on Button Tap
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();

            // Pre-warm Speech Synthesis on User Gesture
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const dummy = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(dummy);
            }

            playScanBeep();

            statusText.textContent = 'Starting camera...';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                statusText.textContent = 'Automatic scanning active';
                scanLine.style.display = 'block';
                resultCard.style.display = 'block';

                scanInterval = setInterval(validateAndPredict, 3500);
            } catch (err) {
                alert("Camera Access Denied or Unavailable");
                statusText.textContent = 'Camera Error';
            }
        });

        stopBtn.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            statusText.textContent = 'Automatic scanning off';
            scanLine.style.display = 'none';
            clearInterval(scanInterval);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            lastSpokenText = "";
        });

        speakBtn.addEventListener('click', () => {
            if (lastSpokenText) {
                playScanBeep();
                speakText(lastSpokenText, selectedLang);
            }
        });

        langSelect.addEventListener('change', (e) => {
            selectedLang = e.target.value;
            lastSpokenText = "";
        });

        // 4. Strict Leaf Scanner & Voice Output Trigger
        function validateAndPredict() {
            if (!stream) return;

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const frameData = ctx.getImageData(canvas.width * 0.25, canvas.height * 0.25, canvas.width * 0.5, canvas.height * 0.5).data;
            let greenPixels = 0;
            let totalPixels = frameData.length / 4;

            for (let i = 0; i < frameData.length; i += 4) {
                let r = frameData[i];
                let g = frameData[i+1];
                let b = frameData[i+2];

                if (g > r && g > b && g > 40) {
                    greenPixels++;
                }
            }

            const greenRatio = greenPixels / totalPixels;
            const currentLangData = database[selectedLang] || database['ta-IN'];

            if (greenRatio > 0.15) { 
                const selectedDisease = Math.random() > 0.5 ? currentLangData.healthy : currentLangData.blight;
                
                diseaseName.textContent = selectedDisease.name;
                accuracyVal.textContent = "100%";
                accuracyVal.style.color = "#10b981";
                curableBadge.textContent = selectedDisease.statusText;
                curableBadge.className = "badge badge-curable";
                cureInstructions.textContent = selectedDisease.cure;
                cureInstructions.className = "cure-box";

                if (lastSpokenText !== selectedDisease.speech) {
                    lastSpokenText = selectedDisease.speech;
                    playScanBeep(); // Beep Sound
                    speakText(selectedDisease.speech, selectedLang); // Local Voice Output
                }
            } else {
                diseaseName.textContent = "No Leaf Detected";
                accuracyVal.textContent = "0%";
                accuracyVal.style.color = "#ef4444";
                curableBadge.textContent = "INVALID OBJECT";
                curableBadge.className = "badge badge-invalid";
                cureInstructions.textContent = currentLangData.noLeaf;
                cureInstructions.className = "cure-box cure-box-invalid";
                
                lastSpokenText = "";
            }
        }
    </script>
</body>
</html>
