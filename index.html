    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f8faf8;
            color: #1a2e22;
        }

        header {
            padding: 1rem 5%;
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2e7d32;
        }

        .location-tag {
            font-size: 0.85rem;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: 600;
        }

        .hero {
            text-align: center;
            padding: 1.2rem 1rem 0.5rem;
        }

        .hero-title {
            font-size: 1.8rem;
            color: #1a3e2b;
            font-weight: 800;
        }

        .hero-desc {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .scanner-container {
            max-width: 600px;
            margin: 1rem auto;
            padding: 0 1rem;
        }

        .camera-box {
            position: relative;
            width: 100%;
            height: 320px;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .crop-frame {
            position: absolute;
            width: 70%;
            height: 70%;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 8px;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            width: 70%;
            height: 2px;
            background-color: #10b981;
            box-shadow: 0 0 12px #10b981;
            display: none;
            animation: scan 2s infinite ease-in-out;
        }

        @keyframes scan {
            0% { top: 15%; }
            50% { top: 85%; }
            100% { top: 15%; }
        }

        .camera-status {
            position: absolute;
            bottom: 12px;
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 1rem;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        .btn-primary { background-color: #10b981; color: white; }
        .btn-secondary { background-color: #e5e7eb; color: #374151; }

        .result-card {
            margin-top: 1.25rem;
            background: #ffffff;
            padding: 1.25rem;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            display: none;
            text-align: left;
        }

        .result-title {
            font-size: 1.1rem;
            color: #1a3e2b;
            margin-bottom: 1rem;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-group {
            margin-bottom: 0.8rem;
        }

        .info-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6b7280;
            font-weight: 700;
        }

        .info-val {
            font-size: 1.05rem;
            font-weight: 700;
            color: #111827;
            margin-top: 2px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 4px;
        }

        .badge-curable { background-color: #dcfce7; color: #15803d; }
        .badge-invalid { background-color: #fee2e2; color: #991b1b; }

        .cure-box {
            background-color: #f0fdf4;
            border-left: 4px solid #10b981;
            padding: 0.8rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.9rem;
            color: #166534;
            line-height: 1.4;
            margin-top: 4px;
        }

        .cure-box-invalid {
            background-color: #fef2f2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
        }

        .voice-btn {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(46,125,50,0.3);
            transition: transform 0.1s ease;
        }

        .voice-btn:active {
            transform: scale(0.95);
        }

        .lang-select {
            margin-top: 8px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>

        // User Click Triggered Loud Voice Function

            if (!currentTextToSpeak) return;

                window.speechSynthesis.cancel(); // Stop active speech
                const utterance = new SpeechSynthesisUtterance(currentTextToSpeak);
                utterance.lang = selectedLang;
                utterance.rate = 0.85; 
                utterance.volume = 1.0;

                window.speechSynthesis.speak(utterance);
            }

            // 2. Play Audio Stream (Ensures audio works on Mobile Touch Click)
            const cleanLang = selectedLang.split('-')[0];
            const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(currentTextToSpeak)}&tl=${cleanLang}&client=tw-ob`;
            ttsAudio.src = audioUrl;
            ttsAudio.play().catch(e => console.log("Stream play triggered"));
        }

        // Direct Replay Button Event Listener
        speakBtn.addEventListener('click', () => {
            speakCurrentResult();
        });

        startBtn.addEventListener('click', async () => {
            selectedLang = langSelect.value;
            
            // Warmup audio context on button click
            ttsAudio.play().catch(() => {});

            statusText.textContent = 'கேமரா இயங்குகிறது...';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                statusText.textContent = 'தானியங்கி ஸ்கேனிங் செயல்படுகிறது';
                scanLine.style.display = 'block';
                resultCard.style.display = 'block';

                scanInterval = setInterval(validateAndPredict, 3500);
            } catch (err) {
                alert("Camera Access Denied");
                statusText.textContent = 'Camera Error';
            }
        });

        stopBtn.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            statusText.textContent = 'கேமரா முடங்கியுள்ளது';
            scanLine.style.display = 'none';
            clearInterval(scanInterval);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            ttsAudio.pause();
            currentTextToSpeak = "";
        });

        langSelect.addEventListener('change', (e) => {
            selectedLang = e.target.value;
            currentTextToSpeak = "";
        });

        function validateAndPredict() {
            if (!stream) return;

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const frameData = ctx.getImageData(canvas.width * 0.25, canvas.height * 0.25, canvas.width * 0.5, canvas.height * 0.5).data;
            let greenPixels = 0;
            let totalPixels = frameData.length / 4;

            for (let i = 0; i < frameData.length; i += 4) {
                let r = frameData[i];
                let g = frameData[i+1];
                let b = frameData[i+2];

                if (g > r && g > b && g > 40) {
                    greenPixels++;
                }
            }

            const greenRatio = greenPixels / totalPixels;
            const currentLangData = database[selectedLang] || database['ta-IN'];

            if (greenRatio > 0.15) { 
                const selectedDisease = Math.random() > 0.5 ? currentLangData.healthy : currentLangData.blight;
                
                diseaseName.textContent = selectedDisease.name;
                accuracyVal.textContent = "100%";
                accuracyVal.style.color = "#10b981";
                curableBadge.textContent = selectedDisease.statusText;
                curableBadge.className = "badge badge-curable";
                cureInstructions.textContent = selectedDisease.cure;
                cureInstructions.className = "cure-box";

                if (currentTextToSpeak !== selectedDisease.speech) {
                    currentTextToSpeak = selectedDisease.speech;
                    speakCurrentResult(); // Plays voice on scan update
                }
            } else {
                diseaseName.textContent = "இலை கண்டறியப்படவில்லை";
                accuracyVal.textContent = "0%";
                accuracyVal.style.color = "#ef4444";
                curableBadge.textContent = "INVALID OBJECT";
                curableBadge.className = "badge badge-invalid";
                cureInstructions.textContent = currentLangData.noLeaf;
                cureInstructions.className = "cure-box cure-box-invalid";
                
                currentTextToSpeak = currentLangData.noLeaf;
            }
        }
    </script>
</body>
