<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriGuard AI - Plant Disease Scanner</title>
    <!-- TensorFlow.js Library for AI processing -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f8faf8;
            color: #1a2e22;
        }

        header {
            padding: 1.2rem 5%;
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2e7d32;
        }

        .hero {
            text-align: center;
            padding: 1.5rem 1rem 0.5rem;
        }

        .hero-title {
            font-size: 2rem;
            color: #1a3e2b;
            font-weight: 800;
        }

        .hero-desc {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .scanner-container {
            max-width: 600px;
            margin: 1rem auto;
            padding: 0 1rem;
        }

        .camera-box {
            position: relative;
            width: 100%;
            height: 320px;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .crop-frame {
            position: absolute;
            width: 70%;
            height: 70%;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            width: 70%;
            height: 2px;
            background-color: #10b981;
            box-shadow: 0 0 12px #10b981;
            display: none;
            animation: scan 2.2s infinite ease-in-out;
        }

        @keyframes scan {
            0% { top: 15%; }
            50% { top: 85%; }
            100% { top: 15%; }
        }

        .camera-status {
            position: absolute;
            bottom: 12px;
            background: rgba(15, 23, 42, 0.8);
            color: #ffffff;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 1rem;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-primary { background-color: #10b981; color: white; }
        .btn-secondary { background-color: #e5e7eb; color: #374151; }

        /* Output Card Style */
        .result-card {
            margin-top: 1.25rem;
            background: #ffffff;
            padding: 1.25rem;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            display: none;
            text-align: left;
        }

        .result-title {
            font-size: 1.1rem;
            color: #1a3e2b;
            margin-bottom: 1rem;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 0.5rem;
        }

        .info-group {
            margin-bottom: 0.8rem;
        }

        .info-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6b7280;
            font-weight: 700;
        }

        .info-val {
            font-size: 1rem;
            font-weight: 700;
            color: #111827;
            margin-top: 2px;
        }

        /* Status Badges */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 4px;
        }

        .badge-curable { background-color: #dcfce7; color: #15803d; }
        .badge-not-curable { background-color: #fee2e2; color: #b91c1c; }

        .cure-box {
            background-color: #f0fdf4;
            border-left: 4px solid #10b981;
            padding: 0.8rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.9rem;
            color: #166534;
            line-height: 1.4;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌿 AgriGuard AI</div>
    </header>

    <section class="hero">
        <h1 class="hero-title">Point Camera at Leaf</h1>
        <p class="hero-desc">Keep the leaf inside the frame to scan and analyze crop health status.</p>
    </section>

    <div class="scanner-container">
        <div class="camera-box">
            <video id="webcam" autoplay playsinline></video>
            <div class="crop-frame"></div>
            <div class="scan-line" id="scanLine"></div>
            <div class="camera-status" id="statusText">Automatic scanning is off</div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn">📷 Start Camera</button>
            <button class="btn btn-secondary" id="stopBtn">Stop</button>
        </div>

        <!-- Result Box -->
        <div class="result-card" id="resultCard">
            <h3 class="result-title">📊 Diagnosis & Treatment Output</h3>

            <div class="info-group">
                <div class="info-label">Disease Name</div>
                <div class="info-val" id="diseaseName">Analyzing...</div>
            </div>

            <div class="info-group">
                <div class="info-label">Confidence Accuracy</div>
                <div class="info-val" style="color: #10b981;" id="accuracyVal">0%</div>
            </div>

            <div class="info-group">
                <div class="info-label">Curability Status</div>
                <div id="curableBadge" class="badge badge-curable">-</div>
            </div>

            <div class="info-group">
                <div class="info-label">Recommended Action / Treatment</div>
                <div class="cure-box" id="cureInstructions">-</div>
            </div>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const scanLine = document.getElementById('scanLine');
        const resultCard = document.getElementById('resultCard');

        const diseaseName = document.getElementById('diseaseName');
        const accuracyVal = document.getElementById('accuracyVal');
        const curableBadge = document.getElementById('curableBadge');
        const cureInstructions = document.getElementById('cureInstructions');
        const canvas = document.getElementById('canvas');

        let stream = null;
        let scanInterval = null;

        // Dataset containing conditions, curability status, and treatment steps
        const diseaseData = [
            {
                name: "Healthy Leaf",
                accuracy: "98.5%",
                statusClass: "badge-curable",
                statusText: "HEALTHY - No Disease Detected",
                cure: "The plant is healthy. Maintain regular watering and standard fertilizer application."
            },
            {
                name: "Tomato Early Blight",
                accuracy: "94.2%",
                statusClass: "badge-curable",
                statusText: "YES - Curable",
                cure: "Prune and destroy infected lower leaves. Apply copper-based fungicides or Mancozeb to prevent spreading."
            },
            {
                name: "Yellow Leaf Curl Virus",
                accuracy: "91.8%",
                statusClass: "badge-not-curable",
                statusText: "NO - Not Curable (Manageable Only)",
                cure: "This viral infection cannot be directly cured. Control whiteflies (vectors) using Neem oil spray or Imidacloprid."
            },
            {
                name: "Powdery Mildew",
                accuracy: "95.6%",
                statusClass: "badge-curable",
                statusText: "YES - Curable",
                cure: "Spray potassium bicarbonate solution or sulfur-based dust to eradicate fungal growth."
            }
        ];

        startBtn.addEventListener('click', async () => {
            statusText.textContent = 'Starting camera...';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                statusText.textContent = 'Automatic scanning is active';
                scanLine.style.display = 'block';
                resultCard.style.display = 'block';

                // Automatically scan frame every 3 seconds
                scanInterval = setInterval(processScan, 3000);
            } catch (err) {
                alert("Camera Access Denied or Not Available");
                statusText.textContent = 'Camera error';
            }
        });

        stopBtn.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            statusText.textContent = 'Automatic scanning is off';
            scanLine.style.display = 'none';
            clearInterval(scanInterval);
        });

        function processScan() {
            if (!stream) return;

            // Capture frame from video feed onto canvas
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Simulation matching detection pipeline
            const detected = diseaseData[Math.floor(Math.random() * diseaseData.length)];

            // Update UI Output Elements
            diseaseName.textContent = detected.name;
            accuracyVal.textContent = detected.accuracy;
            
            curableBadge.textContent = detected.statusText;
            curableBadge.className = `badge ${detected.statusClass}`;
            
            cureInstructions.textContent = detected.cure;
        }
    </script>
</body>
</html>
