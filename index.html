<div class="camera-controls">

    <button
        id="start-camera"
        class="main-button"
    >
        📷 Start Camera
    </button>

    <button
        id="switch-camera"
        class="switch-button"
    >
        🔄 Switch Camera
    </button>

    <button
        id="stop-camera"
        class="stop-button"
    >
        ⏹ Stop
    </button>
<section class="upload-section">
    <h2>🖼️ Upload Crop Image</h2>
    <p>Upload a clear image of the crop leaf for disease detection.</p>

    <div class="upload-box">
        <input
            type="file"
            id="image-upload"
            accept="image/jpeg,image/png,image/jpg,image/webp"
        >

        <button id="upload-button" class="primary-button">
            🔍 Analyze Image
        </button>
    </div>

    <div id="upload-preview-container" style="display:none;">
        <h3>Selected Image</h3>
        <img id="upload-preview" alt="Crop leaf preview">
    </div>

    <p id="upload-status"></p>
</section>
</div>
